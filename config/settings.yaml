# Warp Cortex central settings.
#
# Keep committed defaults here.
# Put machine-specific overrides or real secrets in config/settings.local.yaml.

runtime:
  device: cuda
  verbose: true

paths:
  # Leave empty to use HF_* env vars or repo-local local_artifacts/huggingface.
  huggingface_cache: ""

backends:
  default: local
  local:
    model: Qwen/Qwen2.5-0.5B-Instruct
  api:
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    key: ${OPENAI_API_KEY}
  bitnet:
    model: microsoft/bitnet-b1.58-2B-4T

adaptive_engine:
  mode: both
  council_size: 3
  max_tokens: 150
  temperature: 0.0
  max_delegations: 5
  turbo_quant:
    enabled: true
    bits: 4
    interval: 64
  entropy:
    spread_z_threshold: 2.0
    logit_z_threshold: 2.5
    warmup_steps: 8
  learned_gate:
    enabled: false
    threshold: 0.5
    lr: 0.001
    warmup_steps: 64
    online_learning: true
    checkpoint: ""

orchestrator:
  max_rounds: 3
  worker_count: 4
  verify_claims: false
  llm_workers: false
  stream_inject: false
  async_delegate: false

shared_manifold:
  store_path: ""
  cache_key: default
  hot_capacity: 8
  background_refresh_seconds: 2.0
  prefer_hot_cache_for_workers: true

benchmarks:
  gsm8k:
    n: 20
    modes: single,orchestrated
    workers: 4
    rounds: 3